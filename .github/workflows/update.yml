name: Update UFC calendar

on:
  schedule:
    - cron: "0 11 * * *"   # daily, ~5–6am Central
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: |
          python ufc_ics.py public/ufc.ics
          python spurs_ics.py public/spurs.ics
          test -s public/ufc.ics || { echo "ufc.ics was not created"; exit 1; }
          test -s public/spurs.ics || { echo "spurs.ics was not created"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
